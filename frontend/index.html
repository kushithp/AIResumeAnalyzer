<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta
      name="description"
      content="Compare a resume with a job description and get practical, explainable feedback."
    />
    <title>Resume Studio — AI Resume Analyzer</title>
    <link rel="stylesheet" href="/app/styles.css" />
    <script src="/app/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/app" aria-label="Resume Studio home">
          <span class="brand-mark">r<span>.</span></span>
          <span class="brand-name">resume<span>studio</span></span>
        </a>

        <div class="workspace-label">WORKSPACE</div>
        <nav class="side-nav" aria-label="Main navigation">
          <button class="nav-item is-active" type="button" data-page="dashboard">
            <span class="nav-icon" aria-hidden="true">⌂</span>
            <span>Overview</span>
          </button>
          <button class="nav-item" type="button" data-page="analyze">
            <span class="nav-icon nav-icon-plus" aria-hidden="true">＋</span>
            <span>New analysis</span>
          </button>
          <button class="nav-item" type="button" data-page="history">
            <span class="nav-icon" aria-hidden="true">◷</span>
            <span>Analysis history</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="sidebar-tip">
            <span class="tip-spark" aria-hidden="true">✳</span>
            <p>Small improvements add up.</p>
            <span>Use feedback to make your next application stronger.</span>
          </div>
          <div class="api-status"><span></span> API connected when server is running</div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="page-label">Overview</strong></div>
          <div class="topbar-actions">
            <span class="private-note"><span aria-hidden="true">♧</span> Rules-based analysis · optional AI</span>
            <button class="button button-primary button-small" type="button" data-page="analyze">
              <span aria-hidden="true">＋</span> New analysis
            </button>
          </div>
        </header>

        <main id="main-content" tabindex="-1"></main>
        <footer class="page-footer">Resume Studio <span>·</span> A thoughtful starting point for your next opportunity.</footer>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
